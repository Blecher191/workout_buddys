# Dependabot version updates. Every update arrives as a normal PR and must pass the required
# Backend `checks` job; nothing is auto-merged. Security-update settings live in repo settings.
version: 2
updates:
  # Workflow actions are pinned to commit SHAs; Dependabot bumps the SHA and the version comment.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "ci"
    labels: []
    open-pull-requests-limit: 3

  # Fully pinned runtime and dev requirements (backend/requirements*.txt).
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
      semver-major-days: 14
    groups:
      python-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "chore"
      include: "scope"
    labels: []
    open-pull-requests-limit: 5
